# docker-compose.yml
services:
  mongo:
    container_name: mongo
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    ports:
      - "${MONGODB_LOCAL_PORT}:27017"
    volumes:
      - mongo-data:/data/db


  redis:
    image: redis:7
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_LOCAL_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  zookeeper:
    image: zookeeper:3.8.4
    container_name: zookeeper
    environment:
      ZOO_LOG4J_PROP: "INFO,CONSOLE"
      ZOO_4LW_COMMANDS_WHITELIST: "ruok"
      ZOO_CLIENT_PORT: 2181
    ports:
      - "${ZOOKEEPER_LOCAL_PORT}:2181"
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
    healthcheck:
      test: echo ruok | nc 127.0.0.1 2181 | grep imok
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_DOCKER_PORT: ${MONGODB_DOCKER_PORT}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DOCKER_PORT: ${REDIS_DOCKER_PORT}

      ZOOKEEPER_HOST: ${ZOOKEEPER_HOST}
      ZOOKEEPER_DOCKER_PORT: ${ZOOKEEPER_DOCKER_PORT}

      NODE_SERVER_LOCAL_PORT: ${NODE_SERVER_LOCAL_PORT}
      NODE_SERVER_HOST: ${NODE_SERVER_HOST}

    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      zookeeper:
        condition: service_healthy
    ports:
      - "${NODE_SERVER_LOCAL_PORT}:${NODE_SERVER_LOCAL_PORT}"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    environment:
      - VITE_APP_DOCKER_PORT=${VITE_APP_DOCKER_PORT}
    ports:
      - "${NGINX_LOCAL_PORT}:80"
    depends_on:
      - server

  client:
    depends_on:
      - nginx
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_PUBLIC_BASE_URL=${VITE_PUBLIC_BASE_URL}
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client:/usr/src/client
      - /usr/src/client/node_modules
    ports:
      - ${VITE_APP_LOCAL_PORT}:${VITE_APP_DOCKER_PORT}

volumes:
  mongo-data:
  redis-data:
  zookeeper-data:
  zookeeper-datalog: